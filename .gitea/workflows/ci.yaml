# Example Gitea Actions CI workflow
# Since pull mirrors are read-only, the workflow file must live upstream.
#
# Prerequisites:
#   1. Create a Gitea PAT with write:packages scope
#      (Settings > Applications > Generate Token)
#   2. Add it as a repo/org Actions secret named REGISTRY_TOKEN
#      (repo Settings > Actions > Secrets)

name: CI

on:
  push:

env:
  REGISTRY: gitea.zen.lofi

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: cd ui && npm ci

      - uses: extractions/setup-just@v4
        with:
          github-token: ${{ secrets.CONNECTION_PAT }}

      - uses: astral-sh/ruff-action@v4.0.0
        with:
          version: "0.15"
          src: "server/"
          github-token: ${{ secrets.CONNECTION_PAT }}

      - name: Run lint
        run: just lint-ui

  build-and-push:
    # needs: lint # Don't interrupt the whole run if linting fails
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: ui
            context: ui
            suffix: -ui
          - component: api
            context: server
            suffix: -api
    env:
      IMAGE: ${{ env.REGISTRY }}/${{ gitea.repository }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v6

      - name: Log in to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            docker login "${{ env.REGISTRY }}" \
              --username "${{ gitea.actor }}" \
              --password-stdin

      # TODO: use a build tool that leverages our cache
      - name: Build and push
        env:
          GITEA_SHA: ${{ gitea.sha }}
          CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          SHORT="${GITEA_SHA:0:7}"
          docker build -t "$IMAGE:$SHORT" "$CONTEXT"
          docker push "$IMAGE:$SHORT"

  # Note:
  # Requires repo-level SOPS_AGE_KEY Actions secret. Org-level REGISTRY_TOKEN
  # and CONNECTION_PAT cover registry login + setup-node. SSH keys come from
  # the runner image's volume-mounted /run/ssh-secrets (configured in the
  # gitea-actions Helm chart), so no SSH secrets live in this workflow.
  deploy-prod:
    needs:
      - lint
      - build-and-push
    if: gitea.ref == 'refs/heads/main'
    runs-on: ubuntu-deploy
    env:
      HOST: web2.streetfortress.cloud
    steps:
      - uses: actions/checkout@v6
      - name: Deploy to prod
        env:
          GITEA_SHA: ${{ gitea.sha }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          SHORT="${GITEA_SHA:0:7}"
          just deploy-prod "$HOST" "$SHORT"
