[project]
name = "symbology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "sqlalchemy==2.0.49",
  "psycopg2==2.9.12",
  "structlog==25.5.0",
  "python-dotenv==1.2.2",
  "uuid7==0.1.0",
  "safe-result",
  "alembic>=1.18.3",
  "ruff>=0.15.0",
  "anthropic>=0.52.0",
  "openai>=1.40.0",
  "pgvector>=0.3.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Production runtime deps needed by the worker/CLI (ingestion, CLI, storage).
# Kept separate from the notebook/analysis tooling so the worker image stays lean.
runtime = [
  "edgartools>=5.14.0",
  "httpx==0.28.1",
  "requests>=2.32.3",
  "click>=8.1.0",
  "rich>=13.0.0",
  "boto3>=1.35.0",
  # Imported directly by utils.text HTML-fallback stripping (also transitive
  # deps of edgartools; declared because we import them ourselves).
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
]

# Development dependencies: runtime + interactive analysis/notebook tooling.
dev = [
  "symbology[runtime]",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "jupyter",
  "ipywidgets",
]

# Testing dependencies
test = ["pytest>=8.3.5", "pytest-cov>=6.1.1", "pytest-json-report>=1.5.0"]

# All development dependencies (convenience group)
all = ["symbology[dev,test]"]

# [tool.uv.workspace]
# members = ["src/python"]
[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:pydantic.*:",
  "ignore::UserWarning:pydantic.*:",
]
testpaths = ["tests"]
norecursedirs = []
markers = [
  "integration: requires a running PostgreSQL database (deselect with '-m not integration')",
]
addopts = "-m 'not integration'"

[tool.ruff]
# Enable flake8-bugbear (`B`) rules, and isort (`I`) for import sorting
lint.select = ["E4", "E7", "E9", "F"]
# Allow unused variables when underscore-prefixed
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Exclude a variety of commonly ignored directories
exclude = [
  ".git",
  ".eggs",
  "__pycache__",
  "build",
  "dist",
  "*.ipynb",
  "symbology/bin/",
  "alembic/",
  "tests/",
]
# Same as Black
line-length = 160
# Target Python 3.13
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports in __init__ files
"**llm*" = ["E501"]      # Ignore long lines in prompts, etc
"conftest.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["symbology"]
# Enable automatic import sorting when running Ruff
# automatically-sort-imports = true
# Ensure imports are properly organized
force-single-line = false
force-sort-within-sections = true
order-by-type = false

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["symbology*"]
