services:
  symbology-worker-1:
    image: symbology-server:latest
    container_name: symbology-worker-1
    restart: always
    command: ["python", "-m", "symbology.worker.main"]
    environment:
      OPENAI_API_HOST: 10.0.0.95
      OPENAI_MANAGE_CONTEXT: "false"
      OPENAI_CONTEXT_MIN: 26000
      OPENAI_OVERFLOW_THRESHOLD_TOKENS: 26000
    networks:
      - caddy_network

  symbology-worker-2:
    image: symbology-server:latest
    container_name: symbology-worker-2
    restart: always
    command: ["python", "-m", "symbology.worker.main"]
    environment:
      OPENAI_API_HOST: 10.0.0.99
      OPENAI_MANAGE_CONTEXT: "false"
      OPENAI_OVERFLOW_THRESHOLD_TOKENS: 26000
    networks:
      - caddy_network

networks:
  caddy_network:
    driver: bridge
