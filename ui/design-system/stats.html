<!-- @dsCard group="Components" name="Stats" subtitle="Quick-stats strip, stat blocks, metadata card with compact stats" width="900" -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Stats — Symbology design system</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="site.css" />
	</head>
	<body class="bg-paper p-8">
		<div class="flex flex-col gap-8">
			<div>
				<div class="meta mb-4 text-xs text-ink-4">
					.stats quick-stats strip — 4-across bordered row (2×2 elevated card on mobile)
				</div>
				<div class="stats">
					<div class="stat">
						<div class="stat-value">8,412</div>
						<div class="stat-label">Filings tracked</div>
					</div>
					<div class="stat">
						<div class="stat-value">1,973</div>
						<div class="stat-label">Companies</div>
					</div>
					<div class="stat">
						<div class="stat-value">312</div>
						<div class="stat-label">Change reports</div>
					</div>
					<div class="stat">
						<div class="stat-value">14</div>
						<div class="stat-label">Sectors</div>
					</div>
				</div>
			</div>

			<div class="max-w-sm">
				<div class="meta mb-4 text-xs text-ink-4">.metadata-card with .meta-stats</div>
				<div class="metadata-card">
					<div class="meta-stats">
						<div class="meta-stat">
							<div class="meta-stat-value">42</div>
							<div class="meta-stat-label">Topics</div>
						</div>
						<div class="meta-stat">
							<div class="meta-stat-value">11</div>
							<div class="meta-stat-label">Escalated</div>
						</div>
						<div class="meta-stat">
							<div class="meta-stat-value">6</div>
							<div class="meta-stat-label">New</div>
						</div>
						<div class="meta-stat">
							<div class="meta-stat-value">3</div>
							<div class="meta-stat-label">Removed</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
