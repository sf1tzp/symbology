<!-- @dsCard group="Components" name="Tags" subtitle="Base / solid / new / escalated pills + per-change-kind tags" width="640" -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Tags — Symbology design system</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="site.css" />
		<style>
			/* Mirrors the scoped style in src/lib/components/ChangeKindTag.svelte;
			   --kind values come from changeKindColor() in src/lib/utils/changes.ts */
			.kind-tag {
				background: color-mix(in oklch, var(--kind) 15%, transparent);
				border-color: var(--kind);
				color: var(--kind);
			}
		</style>
	</head>
	<body class="bg-paper p-8">
		<div class="flex flex-col gap-8">
			<div>
				<div class="meta mb-4 text-xs text-ink-4">Base tags (app.css)</div>
				<div class="flex flex-wrap items-center gap-4">
					<span class="tag">10-K</span>
					<span class="tag tag-solid">Annual</span>
					<span class="tag tag-new">New</span>
					<span class="tag tag-escalated">Escalated</span>
				</div>
			</div>

			<div>
				<div class="meta mb-4 text-xs text-ink-4">Change-kind tags (ChangeKindTag)</div>
				<div class="flex flex-wrap items-center gap-4">
					<span class="tag kind-tag" style="--kind: var(--teal-2)">new&nbsp;⇅</span>
					<span class="tag kind-tag" style="--kind: var(--warn)">escalated&nbsp;↗</span>
					<span class="tag kind-tag" style="--kind: var(--blue)">de-emphasised&nbsp;↘</span>
					<span class="tag kind-tag" style="--kind: var(--plum)">reworded&nbsp;⇅</span>
					<span class="tag kind-tag" style="--kind: var(--danger)">removed&nbsp;⇅</span>
				</div>
			</div>
		</div>
	</body>
</html>
