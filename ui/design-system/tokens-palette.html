<!-- @dsCard group="Tokens" name="Palette" subtitle="Paper/ink scale, sage accents, semantic + doc-type colors, dark mode" width="760" -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Palette — Symbology design system</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="site.css" />
	</head>
	<body class="bg-paper p-8">
		<h3 class="sub mb-4 text-ink-3">Paper &amp; rules</h3>
		<div class="mb-8 grid grid-cols-4 gap-4">
			<div>
				<div class="h-14 rounded-md border border-rule-2 bg-paper"></div>
				<div class="meta mt-2 text-xs text-ink-3">--paper</div>
			</div>
			<div>
				<div class="h-14 rounded-md border border-rule-2 bg-paper-2"></div>
				<div class="meta mt-2 text-xs text-ink-3">--paper-2</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-rule"></div>
				<div class="meta mt-2 text-xs text-ink-3">--rule</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-rule-2"></div>
				<div class="meta mt-2 text-xs text-ink-3">--rule-2</div>
			</div>
		</div>

		<h3 class="sub mb-4 text-ink-3">Ink scale</h3>
		<div class="mb-8 grid grid-cols-4 gap-4">
			<div>
				<div class="h-14 rounded-md bg-ink"></div>
				<div class="meta mt-2 text-xs text-ink-3">--ink</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-ink-2"></div>
				<div class="meta mt-2 text-xs text-ink-3">--ink-2</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-ink-3"></div>
				<div class="meta mt-2 text-xs text-ink-3">--ink-3</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-ink-4"></div>
				<div class="meta mt-2 text-xs text-ink-3">--ink-4</div>
			</div>
		</div>

		<h3 class="sub mb-4 text-ink-3">Accents (Tea Green family)</h3>
		<div class="mb-8 grid grid-cols-6 gap-4">
			<div>
				<div class="h-14 rounded-md bg-sage"></div>
				<div class="meta mt-2 text-xs text-ink-3">--sage</div>
			</div>
			<div>
				<div class="h-14 rounded-md border border-rule bg-sage-2"></div>
				<div class="meta mt-2 text-xs text-ink-3">--sage-2</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-teal"></div>
				<div class="meta mt-2 text-xs text-ink-3">--teal</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-teal-2"></div>
				<div class="meta mt-2 text-xs text-ink-3">--teal-2</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-emerald"></div>
				<div class="meta mt-2 text-xs text-ink-3">--emerald</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-olive"></div>
				<div class="meta mt-2 text-xs text-ink-3">--olive</div>
			</div>
		</div>

		<h3 class="sub mb-4 text-ink-3">Semantic &amp; doc-type accents</h3>
		<div class="mb-8 grid grid-cols-5 gap-4">
			<div>
				<div class="h-14 rounded-md bg-warn"></div>
				<div class="meta mt-2 text-xs text-ink-3">--warn</div>
			</div>
			<div>
				<div class="h-14 rounded-md bg-danger"></div>
				<div class="meta mt-2 text-xs text-ink-3">--danger</div>
			</div>
			<div>
				<div class="h-14 rounded-md" style="background: var(--blue)"></div>
				<div class="meta mt-2 text-xs text-ink-3">--blue</div>
			</div>
			<div>
				<div class="h-14 rounded-md" style="background: var(--gold)"></div>
				<div class="meta mt-2 text-xs text-ink-3">--gold</div>
			</div>
			<div>
				<div class="h-14 rounded-md" style="background: var(--plum)"></div>
				<div class="meta mt-2 text-xs text-ink-3">--plum</div>
			</div>
		</div>

		<h3 class="sub mb-4 text-ink-3">Dark mode</h3>
		<div class="dark rounded-lg border border-rule-2 bg-paper p-6">
			<div class="grid grid-cols-6 gap-4">
				<div>
					<div class="h-14 rounded-md border border-rule bg-paper"></div>
					<div class="meta mt-2 text-xs text-ink-3">--paper</div>
				</div>
				<div>
					<div class="h-14 rounded-md border border-rule bg-paper-2"></div>
					<div class="meta mt-2 text-xs text-ink-3">--paper-2</div>
				</div>
				<div>
					<div class="h-14 rounded-md bg-ink"></div>
					<div class="meta mt-2 text-xs text-ink-3">--ink</div>
				</div>
				<div>
					<div class="h-14 rounded-md bg-rule"></div>
					<div class="meta mt-2 text-xs text-ink-3">--rule</div>
				</div>
				<div>
					<div class="h-14 rounded-md bg-sage"></div>
					<div class="meta mt-2 text-xs text-ink-3">--sage</div>
				</div>
				<div>
					<div class="h-14 rounded-md bg-teal-2"></div>
					<div class="meta mt-2 text-xs text-ink-3">--teal-2</div>
				</div>
			</div>
		</div>
	</body>
</html>
